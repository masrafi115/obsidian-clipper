name: Build and Release CLI

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build CLI
        run: npm run build:cli
      
      - name: Build API
        run: npm run build:api
      
      - name: Install production dependencies only
        run: npm ci --production
      
      - name: Create standalone package
        run: |
          mkdir -p obsidian-clipper-standalone
          cp dist/cli.cjs obsidian-clipper-standalone/
          cp -r node_modules obsidian-clipper-standalone/
          cp package.json obsidian-clipper-standalone/
          cp package-lock.json obsidian-clipper-standalone/
      
      - name: Upload CLI with dependencies
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-clipper-standalone
          path: obsidian-clipper-standalone/
          retention-days: 30
      
      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-clipper-api
          path: dist/api.mjs
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build CLI and API
        run: npm run prepublishOnly
      
      - name: Install production dependencies only
        run: npm ci --production
      
      - name: Download standalone artifact
        uses: actions/download-artifact@v4
        with:
          name: obsidian-clipper-standalone
          path: obsidian-clipper-standalone
      
      - name: Create tarball for standalone CLI
        run: |
          tar -czf obsidian-clipper-standalone-linux-x64.tar.gz obsidian-clipper-standalone/
      
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: obsidian-clipper-api
          path: dist
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/cli.cjs
            dist/api.mjs
            obsidian-clipper-standalone-linux-x64.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
